[extend]
useDefault = true

# These exact release-metadata assignments contain public Git commit IDs.
# Do not exempt token variables, entire workflow files or arbitrary hashes.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Immutable public source identities in release metadata"
regexTarget = "line"
regexes = ['''^\s+(?:LABINSIGHT_RELEASE_SHA|LABDAM_AUTH_RELEASE_SHA): (?:53bf3c88a08f50de53ff5ea37b5c016140bbed24|2ad3ef9b5931323f7ef222d198972821e8ae00aa)\s*$''']

[[rules.allowlists]]
description = "Verified public Worker font-build commit used by release PR 51"
regexTarget = "line"
regexes = ['''^\s+LABDAM_AUTH_RELEASE_SHA: aab3aeb8b9557fcff3f2827e95e8b724a0718695\s*$''']

[[rules.allowlists]]
description = "Verified public dedicated REPODAM login source commit"
regexTarget = "line"
regexes = ['''^\s+LABDAM_AUTH_RELEASE_SHA: 55c1843e5dac79059fb468a1e1a29917bcd96c21\s*$''']

[[rules.allowlists]]
description = "Verified public REPODAM login redesign source commit used by release PR 60"
regexTarget = "line"
regexes = ['''^\s+LABDAM_AUTH_RELEASE_SHA: db9e9da6954c80f647abece1d5d480822db28c62\s*$''']

[[rules.allowlists]]
description = "Verified public dual-domain Worker source commit"
regexTarget = "line"
regexes = ['''^\s+LABDAM_AUTH_RELEASE_SHA: 3b79151db05d0ac4b810e6f7ac11c8625a400e16\s*$''']

[[rules.allowlists]]
description = "Verified public Worker probe release source commit"
regexTarget = "line"
regexes = ['''^\s+LABDAM_AUTH_RELEASE_SHA: 1d028bf36ece8153b50e26ff62fe9416ae2e265d\s*$''']
