#refreshStatus{width:100%;min-height:54px;font-size:16px}a{color:#1F7F83}a:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #1F7F83;outline-offset:3px}.error{color:#9e203c}
table{width:100%;border-collapse:collapse}th,td{padding:11px 7px;border-bottom:1px solid #D6E2E3;text-align:left;font-size:.85rem;overflow-wrap:anywhere}th{color:#4E6275}td .actions{margin:0;gap:5px}td button{min-height:40px;padding:7px 10px;font-size:.8rem}

8046875 35.15625H435.25390625Z"/></svg><span>리포담</span></a><a class="header-link" href="https://haru-today.github.io/">랩담 홈페이지 <span aria-hidden="true">↗</span></a></div></header><main>
<div class="status-icon" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F7F83" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
<p class="hint">리포담 가입 신청</p><h1>가입 승인 안내</h1><p id="message" class="status" role="status">계정 상태를 확인하고 있습니다.</p>
<button type="button" id="refreshStatus">승인 상태 다시 확인</button><p class="muted">승인 후 이 버튼을 누르면 다시 로그인하지 않고 리포담을 이용할 수 있습니다.</p>
<section id="detail" hidden><dl><dt>로그인 계정</dt><dd id="email"></dd><dt>신청 상태</dt><dd id="status"></dd></dl>
<div id="purposeWrap"><form id="purposeForm"><label for="purpose">가입 목적 (선택, 최대 240자)</label><p class="muted">서비스 사용 목적을 짧게 적어 주시면 관리자가 신청을 검토할 수 있습니다. 건강검진 수치나 민감정보는 입력하지 마세요.</p><textarea id="purpose" maxlength="240" autocomplete="off"></textarea><div class="actions"><button type="submit" id="savePurpose">가입 목적 저장</button></div></form></div>
<p id="formMessage" role="status" class="status"></p></section>
<div class="actions"><a class="button secondary" href="/login.html?switch=1">다른 계정으로 로그인</a><button type="button" class="secondary" id="logout">로그아웃</button><a class="button secondary" href="https://haru-today.github.io/caffeine-atlas/">Caffeine Atlas 공개 체험</a></div></main>
<footer><p>관리자 승인 전에는 리포담을 이용할 수 없습니다. <a href="/membership-privacy.html">가입 개인정보 안내</a></p><div class="actions"><button type="button" id="withdraw" class="secondary">가입 신청 철회·정보 삭제</button> <span id="withdrawMessage" role="status"></span></div></footer>
<script>(async function(){
const msg=document.getElementById("message"),detail=document.getElementById("detail");
const form=document.getElementById("purposeForm"),refresh=document.getElementById("refreshStatus");
const save=document.getElementById("savePurpose"),withdraw=document.getElementById("withdraw"),logout=document.getElementById("logout");
let csrf="",checking=false,mutating=false,canEdit=false;
function clearHealthReport(){
 let ok=true;
 for(const store of [sessionStorage,localStorage]){
  try{
   store.removeItem("labinsight-latest-report");
   store.removeItem("labinsight-carepath-session-v1");
   store.removeItem("labinsight-demo-bookings-v2");
   store.removeItem("labinsight-bookings");
  }catch(_){ok=false;}
 }
 return ok;
}
function syncControls(){
 refresh.disabled=checking||mutating;
 save.disabled=checking||mutating||!csrf||!canEdit;
 withdraw.disabled=checking||mutating||!csrf;
 logout.disabled=checking||mutating||!csrf;
}
async function checkStatus(){
 if(checking||mutating)return;
 checking=true;csrf="";canEdit=false;detail.hidden=true;syncControls();
 try{
  const res=await fetch("/api/me",{credentials:"same-origin",cache:"no-store"});
  if(res.status===401){location.replace("/login.html");return;}
  if(!res.ok)throw new Error("status_failed");
  const me=await res.json();csrf=me.csrf;
  if(me.status==="approved"){location.replace("/labinsight/");return;}
  detail.hidden=false;document.getElementById("email").textContent=me.email;
  const pending=me.status==="pending";canEdit=pending;
  document.getElementById("status").textContent=pending?"관리자 승인 대기":"승인되지 않음";
  msg.textContent=pending?"가입 신청이 접수됐습니다. 관리자가 승인하면 리포담을 이용할 수 있습니다.":"현재 계정은 승인되지 않았습니다. 관리자에게 문의해 주세요.";
  document.getElementById("purposeWrap").hidden=!pending;
  document.getElementById("purpose").value=me.purpose||"";
 }catch(_){msg.textContent="로그인 상태를 확인하지 못했습니다. 승인 상태 다시 확인을 눌러 주세요.";}
 finally{checking=false;syncControls();}
}
refresh.addEventListener("click",checkStatus);
syncControls();
await checkStatus();
form.addEventListener("submit",async e=>{
 e.preventDefault();
 if(!csrf||!canEdit||checking||mutating)return;
 const target=document.getElementById("formMessage");
 mutating=true;syncControls();target.textContent="가입 목적을 저장하고 있습니다.";
 try{
  const r=await fetch("/api/application",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-CSRF-Token":csrf},body:JSON.stringify({purpose:document.getElementById("purpose").value})});
  target.textContent=r.ok?"가입 목적이 저장되었습니다.":"저장하지 못했습니다. 다시 확인해 주세요.";
 }catch(_){target.textContent="네트워크 연결을 확인해 주세요.";}
 finally{mutating=false;syncControls();}
});
withdraw.addEventListener("click",async()=>{
 if(!csrf||checking||mutating)return;
 if(!confirm("가입 신청과 Google 계정 연결 정보를 삭제할까요? 다시 이용하려면 새 가입 신청부터 시작해야 합니다."))return;
 const status=document.getElementById("withdrawMessage");
 mutating=true;syncControls();status.textContent="가입 신청을 철회하고 있습니다.";
 try{
  const r=await fetch("/api/account/delete",{method:"POST",credentials:"same-origin",headers:{"X-CSRF-Token":csrf}});
  if(!r.ok){status.textContent="가입 철회 처리에 실패했습니다.";return;}
  if(!clearHealthReport()){status.textContent="가입 정보는 삭제됐지만 이 기기의 임시 검사 결과 삭제에 실패했습니다. 사이트 데이터를 직접 삭제하세요.";return;}
  location.replace("/login.html");
 }catch(_){status.textContent="네트워크 연결을 확인해 주세요.";}
 finally{mutating=false;syncControls();}
});
logout.addEventListener("click",async()=>{
 if(!csrf||checking||mutating)return;
 mutating=true;syncControls();msg.textContent="로그아웃하고 있습니다.";
 try{
  const r=await fetch("/auth/logout",{method:"POST",credentials:"same-origin",headers:{"X-CSRF-Token":csrf}});
  if(r.ok||r.status===303){
   if(!clearHealthReport()){msg.textContent="로그아웃됐지만 이 기기의 임시 검사 결과를 지우지 못했습니다. 사이트 데이터를 직접 삭제하세요.";return;}
   location.replace("/login.html");
  }
  else{msg.textContent="로그아웃을 완료하지 못했습니다.";}
 }catch(_){msg.textContent="네트워크 연결을 확인한 뒤 로그아웃을 다시 시도해 주세요.";}
 finally{mutating=false;syncControls();}
});
})();</script></body></html>
