<!doctype html><html lang="ko"><head><title>회원 승인 관리 | LABDAM</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#102b50"><style>
:root{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1b334c;background:#f3f6fb;font-size:16px}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{background:#102b50;color:#fff;padding:18px max(20px,calc((100% - 980px)/2))}header a{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.06em}main{max-width:770px;margin:0 auto;padding:clamp(28px,7vw,76px) 20px 80px}h1{font-size:clamp(1.75rem,5.5vw,2.55rem);letter-spacing:-.035em}h2{font-size:1.15rem}p{line-height:1.75}section{background:#fff;border:1px solid #d8e2ee;border-radius:16px;padding:clamp(18px,4vw,30px);margin:20px 0;box-shadow:0 7px 24px #102b5008}.muted{color:#52677b;font-size:.91rem}.hint{color:#365c85;font-weight:650}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:9px;padding:11px 17px;border:1px solid #1f5b97;background:#1f5b97;color:#fff;cursor:pointer;text-decoration:none;font-size:.95rem;font-weight:700}button.secondary,.button.secondary{background:#fff;color:#1f5b97}button:disabled{opacity:.55;cursor:not-allowed}a{color:#245baa}a:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #245baa;outline-offset:3px}textarea{display:block;width:100%;padding:12px;border-radius:9px;border:1px solid #9ab1cc;font:inherit;min-height:95px}label{font-weight:700}dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px}dt{color:#53687b}dd{margin:0;overflow-wrap:anywhere}.status{font-weight:700;color:#234c78;line-height:1.65}.error{color:#9e203c}table{width:100%;border-collapse:collapse}th,td{padding:11px 7px;border-bottom:1px solid #dae4ee;text-align:left;font-size:.85rem;overflow-wrap:anywhere}th{color:#435c73}td .actions{margin:0;gap:5px}td button{min-height:40px;padding:7px 10px;font-size:.8rem}td button.secondary{color:#214d83;background:white}footer{max-width:770px;margin:0 auto;padding:18px 20px 55px;color:#637388;font-size:.8rem}@media(max-width:630px){dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:13px}.table-wrap{overflow-x:auto}table{min-width:600px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><a href="/">LABDAM</a></header><main>
<p class="hint">ADMIN ONLY</p><h1>회원가입 신청 관리</h1><p class="muted">Google 인증을 마친 신청자를 승인·거절하거나 기존 승인을 회수합니다. 승인하면 LABDAM과 REPODAM 이용이 즉시 가능해집니다. 이 화면에 건강검진 결과는 표시되지 않습니다.</p>
<section><div class="actions"><button type="button" id="refresh">신청 목록 새로고침</button><a class="button secondary" href="/account.html">내 계정</a></div>
<p class="status" id="status" role="status" aria-live="polite">관리자 권한을 확인하고 있습니다.</p>
<div class="table-wrap"><table><thead><tr><th>신청자</th><th>신청 내용</th><th>상태</th><th>관리자 처리</th></tr></thead><tbody id="members"></tbody></table></div>
</section></main><footer>승인 이력과 신청 상태는 D1에 저장됩니다. 비밀번호는 저장하지 않습니다.</footer>
<script>(async function(){
const msg=document.getElementById("status"),body=document.getElementById("members");
const refresh=document.getElementById("refresh");let csrf="",updating=false,loading=false;
function setBusy(busy){
 refresh.disabled=busy||loading;
 for(const button of body.querySelectorAll("button[data-next-status]")){
  button.disabled=busy||button.dataset.nextStatus===button.closest("tr").dataset.currentStatus;
 }
}
async function load(){
 if(loading)return;
 loading=true;setBusy(updating);
 msg.textContent="신청 목록을 불러오는 중입니다.";
 try{
  const res=await fetch("/api/admin/applications",{credentials:"same-origin",cache:"no-store"});
  if(!res.ok){msg.textContent="관리자 권한이 없거나 로그인 세션이 만료되었습니다.";return;}
  const data=await res.json();body.replaceChildren();
  for(const m of data.members){
   const row=document.createElement("tr");row.dataset.currentStatus=m.status;
   const identity=document.createElement("td");const email=document.createElement("strong");email.textContent=m.email;
   const small=document.createElement("small");small.textContent=" "+(m.display_name||"")+" · 신청 "+new Date(m.created_at*1000).toLocaleDateString("ko-KR");
   identity.append(email,document.createElement("br"),small);
   const purpose=document.createElement("td");purpose.textContent=m.purpose||"(입력 없음)";
   const status=document.createElement("td");status.textContent=({pending:"승인 대기",approved:"승인됨",rejected:"거절됨"})[m.status]||m.status;
   const actions=document.createElement("td");const commands=document.createElement("div");commands.className="actions";
   for(const [caption,next] of [["승인","approved"],["거절","rejected"],["대기로","pending"]]){
    const button=document.createElement("button");button.type="button";button.className=next==="approved"?"":"secondary";button.textContent=caption;
    button.dataset.nextStatus=next;button.disabled=m.status===next;
    button.addEventListener("click",async()=>{
     if(updating||loading)return;
     const warning=(next!=="approved"||m.status==="rejected")?"\n기존 로그인 세션은 무효화됩니다. 재승인 후에는 다시 로그인해야 할 수 있습니다.":"";
     if(!window.confirm(m.email+" 계정을 '"+caption+"' 처리할까요?"+warning))return;
     updating=true;setBusy(true);msg.textContent="회원 상태를 변경하고 있습니다.";
     try{
      const result=await fetch("/api/admin/review",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-CSRF-Token":csrf},body:JSON.stringify({google_sub:m.google_sub,status:next})});
      if(!result.ok)throw new Error("update_failed");
      await load();
     }catch(_){msg.textContent="회원 상태를 변경하지 못했습니다. 다시 시도해 주세요.";}
     finally{updating=false;setBusy(false);}
    });
    commands.appendChild(button);
   }actions.append(commands);row.append(identity,purpose,status,actions);body.append(row);
  }
  msg.textContent="신청자 "+data.members.length+"명. 승인되지 않은 신청자는 보호된 서비스에 접근할 수 없습니다.";
 }catch(_){msg.textContent="신청 목록 조회에 실패했습니다.";}
 finally{loading=false;setBusy(updating);}
}
try{const res=await fetch("/api/me",{cache:"no-store",credentials:"same-origin"});if(!res.ok)throw Error("invalid");
const me=await res.json();if(me.role!=="admin"||me.status!=="approved"){msg.textContent="관리자만 사용할 수 있습니다.";return;}
csrf=me.csrf;refresh.addEventListener("click",()=>{if(!updating)load();});await load();
}catch(_){msg.textContent="로그인과 관리자 승인 상태를 확인할 수 없습니다.";}
})();</script></body></html>
