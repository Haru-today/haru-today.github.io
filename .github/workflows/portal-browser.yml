name: LABDAM browser review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run desktop and mobile browser checks
        run: npm run test:browser
      - name: Upload screenshots, HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labdam-browser-review
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
