name: LABDAM public search entry protection audit

on:
  workflow_dispatch:
  # One low-volume anonymous GET audit each morning (08:17 Asia/Seoul).
  # Scheduled Actions may start later; no Cloudflare deployments or D1 writes.
  schedule:
    - cron: '17 23 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'scripts/check-public-root-handoff.mjs'
      - 'tests/public-root-handoff.test.cjs'
      - '.github/workflows/public-root-handoff-audit.yml'

permissions:
  contents: read

jobs:
  anonymous-route-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test safe external audit with synthetic responses
        run: node --test tests/public-root-handoff.test.cjs
      - name: Probe live public root and approved Worker without credentials
        run: node scripts/check-public-root-handoff.mjs
