name: LABDAM trial Worker release (manual only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-LABDAM-TRIAL to authorize changes only to the isolated trial Worker"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: labdam-trial-worker-release
  cancel-in-progress: false

jobs:
  trial-release:
    if: ${{ github.event.inputs.confirmation == 'DEPLOY-LABDAM-TRIAL' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: labdam-trial
    steps:
      - name: Fetch fully reviewed login branch snapshot (immutable)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 53bf3c88a08f50de53ff5ea37b5c016140bbed24
          persist-credentials: false
      - name: Verify read access to the reviewed app source before private checkout
        env:
          GH_TOKEN: ${{ secrets.LABINSIGHT_SOURCE_TOKEN || github.token }}
          REVIEWED_APP_SHA: 89bce79af4b79304c1f0f1027b67a6c172cb541f
        run: |
          if ! gh api "repos/Haru-today/labinsight/commits/$REVIEWED_APP_SHA" --silent 2>/dev/null; then
            echo "::error::Cannot read the pinned REPODAM source. For private source, configure the labdam-trial environment's LABINSIGHT_SOURCE_TOKEN with read-only Contents access to Haru-today/labinsight. No deployment was started."
            exit 1
          fi
      - name: Fetch fully reviewed REPODAM snapshot (immutable)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Haru-today/labinsight
          ref: 89bce79af4b79304c1f0f1027b67a6c172cb541f
          path: sources/labinsight
          token: ${{ secrets.LABINSIGHT_SOURCE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify OAuth security and bootstrap using synthetic identities
        run: node --test tests/free-auth.test.cjs tests/free-auth-pages.test.cjs
      - name: Build public LABDAM brand and protected REPODAM bundle
        env:
          LABINSIGHT_SOURCE: ${{ github.workspace }}/sources/labinsight
        run: node free-auth/build.mjs
      - name: Stamp non-sensitive reviewed source identity in the public membership notice
        env:
          LABINSIGHT_RELEASE_SHA: 89bce79af4b79304c1f0f1027b67a6c172cb541f
          LABDAM_AUTH_RELEASE_SHA: 53bf3c88a08f50de53ff5ea37b5c016140bbed24
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const app = process.env.LABINSIGHT_RELEASE_SHA, auth = process.env.LABDAM_AUTH_RELEASE_SHA;
          if (![app, auth].every(value => /^[0-9a-f]{40}$/.test(value || ''))) throw Error('Invalid reviewed source identity');
          const digest = file => createHash('sha256').update(fs.readFileSync('free-auth/dist/labinsight/' + file)).digest('hex');
          const portalDigest = file => createHash('sha256').update(fs.readFileSync('free-auth/dist/' + file)).digest('hex');
          const metadata = [['labdam-home-sha256', portalDigest('index.html')], ['labdam-portal-session-sha256', portalDigest('assets/portal-session.js')], ['labinsight-source-sha', app], ['labdam-auth-source-sha', auth], ['labinsight-app-sha256', digest('app.js')], ['labinsight-html-sha256', digest('index.html')], ['labinsight-css-sha256', digest('styles.css')], ['labinsight-carepath-sha256', digest('carepath.js')], ['labinsight-ocr-sha256', digest('ocr-review.js')], ['labinsight-checkup-sha256', digest('checkup.html')], ['labinsight-hospitals-sha256', digest('hospitals.html')]];
          const file = 'free-auth/dist/membership-privacy.html';
          const html = fs.readFileSync(file, 'utf8');
          if (!html.includes('<head>') || !html.includes('content="draft"')) throw Error('Expected reviewed draft membership notice');
          fs.writeFileSync(file, html.replace('<head>', '<head>\n' + metadata.map(([name, value]) => '<meta name="' + name + '" content="' + value + '">').join('\n')));
          console.log('Stamped public commit identities and static SHA256 values only; no credentials or member data.');
          NODE
      - name: Fail closed if trial origin, D1 binding, asset policy or files differ
        run: |
          node free-auth/scripts/preflight-static.mjs --require-real-d1
          test ! -e free-auth/dist/caffeine-atlas
          test ! -e free-auth/dist/free-auth
          test -f free-auth/dist/labinsight/carepath.html
          test -f free-auth/dist/labinsight/carepath.js
          test -f free-auth/dist/labinsight/carepath-data.js
          test -f free-auth/dist/labinsight/supplement-guidance.js
          ! grep -R -i 'GOOGLE_CLIENT_SECRET\|BOOTSTRAP_ADMIN_EMAIL\|RATE_LIMIT_SECRET' free-auth/dist/
      - name: Verify protected static assets and local workerd + D1 approval flows
        env:
          LABINSIGHT_SOURCE: ${{ github.workspace }}/sources/labinsight
        run: |
          node --test free-auth/tests/bundle.test.cjs
          npm ci --prefix free-auth/tests/runtime --no-audit --no-fund
          npm test --prefix free-auth/tests/runtime
      - name: Require separately configured Cloudflare trial secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # No token, account ID or provider response is printed in this check.
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing GitHub Secret::CLOUDFLARE_API_TOKEN is unavailable to the labdam-trial job. Configure the secret in Settings > Environments > labdam-trial, or as a repository Actions secret."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Missing GitHub Secret::CLOUDFLARE_ACCOUNT_ID is unavailable to the labdam-trial job. Configure the secret in Settings > Environments > labdam-trial, or as a repository Actions secret."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Cloudflare credential variables are set; permission and D1 readiness checks follow."
      - name: Verify remote D1 has the expected schema (read-only, no member rows)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          # Compile against all required tables and fields; LIMIT 0 returns no member data.
          npx --yes wrangler@4.151.0 d1 execute labdam-membership --config free-auth/wrangler.jsonc --remote --command "SELECT m.status, s.token_hash, o.nonce, t.attempts FROM members m, sessions s, oauth_states o, login_throttle t WHERE 0 LIMIT 0"
      - name: Deploy to named free test Worker only (never Pages or production routes)
        id: deploy_trial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.0 deploy --config free-auth/wrangler.jsonc
      - name: Read-only anonymous HTTP checks (no test users, OAuth writes, or PII)
        env:
          TRIAL_ORIGIN: https://labdam-free-approval.jleegenomics.workers.dev
        run: |
          set -eu
          ready=0
          # CDN propagation may briefly serve a previous Worker immediately
          # after Wrangler reports a successful deploy. Retry only GET checks.
          for attempt in 1 2 3 4 5; do
            health=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 12 "$TRIAL_ORIGIN/healthz" || true)
            login=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 12 "$TRIAL_ORIGIN/login.html" || true)
            gate=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 12 "$TRIAL_ORIGIN/labinsight/app.js" || true)
            redirect=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 12 "$TRIAL_ORIGIN/labinsight/" || true)
            echo "Attempt $attempt/5: health=$health login=$login protected_js=$gate private_html=$redirect"
            if [ "$health" = 200 ] && [ "$login" = 200 ] && [ "$gate" = 401 ] && [ "$redirect" = 303 ]; then
              # An older Worker can be healthy but must NOT pass this exact-release check.
              health_body=$(curl --fail --silent --show-error --max-time 12 "$TRIAL_ORIGIN/healthz" || true)
              if printf '%s' "$health_body" | grep -Fq '"readiness":"bindings-present"' &&
                 printf '%s' "$health_body" | grep -Fq '"release":"labdam-auth-20261023-public-brand"'; then
                ready=1
                break
              fi
            fi
            if [ "$attempt" -lt 5 ]; then sleep 4; fi
          done
          test "$health" = 200
          test "$login" = 200
          test "$gate" = 401
          test "$redirect" = 303
          if [ "$ready" -ne 1 ]; then
            echo "::error title=Worker readiness mismatch::Trial Worker /healthz does not report the expected release labdam-auth-20261023-public-brand with healthy bindings. Check version propagation, OAuth secrets, D1 and static assets."
            exit 1
          fi
          echo "Anonymous trial HTTP gate passed after bounded readiness checks."
      - name: Verify public brand homepage and private service login entry
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const origin = 'https://labdam-free-approval.jleegenomics.workers.dev';
          const hash = data => createHash('sha256').update(data).digest('hex');
          for (const [route, file] of [['/', 'index.html'], ['/assets/portal-session.js', 'assets/portal-session.js']]) {
            const response = await fetch(origin + route, { redirect:'manual', credentials:'omit', signal:AbortSignal.timeout(20000) });
            assert.equal(response.status, 200);
            assert.match(response.headers.get('cache-control') || '', /no-store/);
            assert.equal(hash(Buffer.from(await response.arrayBuffer())), hash(readFileSync('free-auth/dist/' + file)));
          }
          const response = await fetch(origin + '/api/session-status', { credentials:'omit', redirect:'error', signal:AbortSignal.timeout(20000) });
          assert.equal(response.status, 200);
          assert.deepEqual(await response.json(), { authenticated:false });
          const gated = await fetch(origin + '/labinsight/', { redirect:'manual', credentials:'omit', signal:AbortSignal.timeout(20000) });
          assert.equal(gated.status, 303);
          const target = new URL(gated.headers.get('location'), origin);
          assert.equal(target.origin, origin);
          assert.equal(target.pathname, '/');
          assert.equal(target.hash, '#login');
          assert.equal(target.searchParams.get('next'), '/labinsight/');
          console.log('Public LABDAM files match this build; anonymous REPODAM entry returns to homepage login.');
          NODE
      - name: Verify exact app source and confirmed public privacy contact after deployment
        env:
          LABINSIGHT_RELEASE_SHA: 89bce79af4b79304c1f0f1027b67a6c172cb541f
          LABDAM_AUTH_RELEASE_SHA: 53bf3c88a08f50de53ff5ea37b5c016140bbed24
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://labdam-free-approval.jleegenomics.workers.dev/membership-privacy.html', { redirect: 'error', signal: AbortSignal.timeout(20000) });
          assert.equal(response.status, 200);
          assert.match(response.headers.get('cache-control') || '', /no-store/);
          const html = await response.text();
          for (const [name, value] of [['labinsight-source-sha', process.env.LABINSIGHT_RELEASE_SHA], ['labdam-auth-source-sha', process.env.LABDAM_AUTH_RELEASE_SHA]]) assert.ok(html.includes('<meta name="' + name + '" content="' + value + '">'), 'Source identity mismatch');
          assert.match(html, /name="labinsight-app-sha256" content="[0-9a-f]{64}"/);
          assert.match(html, /name="labinsight-html-sha256" content="[0-9a-f]{64}"/);
          assert.match(html, /name="labinsight-css-sha256" content="[0-9a-f]{64}"/);
          assert.match(html, /name="labinsight-carepath-sha256" content="[0-9a-f]{64}"/);
          for (const name of ['labinsight-ocr-sha256', 'labinsight-checkup-sha256', 'labinsight-hospitals-sha256']) assert.ok(new RegExp('name="' + name + '" content="[0-9a-f]{64}"').test(html));
          assert.ok(html.includes('REPODAM') && !html.includes('LabInsight') && !html.includes('랩인사이트'));
          assert.ok(html.includes('이정민') && html.includes('mailto:jleegenomics@gmail.com'));
          assert.ok(html.includes('name="policy-status" content="draft"'));
          console.log('Verified exact reviewed source identities, contact and honest draft status on the live Worker.');
          NODE
      - name: Verify new compact login UI and public Caffeine Atlas link on live trial origin
        env:
          TRIAL_ORIGIN: https://labdam-free-approval.jleegenomics.workers.dev
        run: |
          set -eu
          # The Worker health marker is unchanged by this UI-only release.
          # Validate the actual HTML to reject a successful but stale r3 deployment.
          ui_ready=0
          for attempt in 1 2 3 4 5; do
            login_html=$(curl --fail --silent --show-error --max-time 12 "$TRIAL_ORIGIN/login.html" || true)
            if printf '%s' "$login_html" | grep -Fq '<span class="welcome-line">LABDAM에 오신 것을</span>' &&
               printf '%s' "$login_html" | grep -Fq '<span class="welcome-line">환영합니다.</span>' &&
               printf '%s' "$login_html" | grep -Fq 'class="caffeine-card"' &&
               printf '%s' "$login_html" | grep -Fq '로그인 불필요' &&
               printf '%s' "$login_html" | grep -Fq 'href="https://haru-today.github.io/caffeine-atlas/"' &&
               printf '%s' "$login_html" | grep -Fq '.privacy-copy{margin-top:11px;font-size:12px;line-height:1.65;color:#52657d}' &&
               printf '%s' "$login_html" | grep -Fq '#localDataStatus{margin-top:9px;font-size:12px;color:#52657d}' &&
               printf '%s' "$login_html" | grep -Fq '"labinsight-demo-bookings-v2"' &&
               printf '%s' "$login_html" | grep -Fq '"labinsight-bookings"' &&
               printf '%s' "$login_html" | grep -Fq 'REPODAM' &&
               printf '%s' "$login_html" | grep -Fq 'href="/auth/start"'; then
              ui_ready=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then sleep 4; fi
          done
          if [ "$ui_ready" -ne 1 ]; then
            echo "::error title=Trial login UI mismatch::Deployed login.html does not contain the reviewed two-line welcome heading, improved text contrast, scoped demo-booking cleanup, Google OAuth link and public Caffeine Atlas card."
            exit 1
          fi
          echo "Verified LABDAM login markup and account-switch booking cleanup on the live trial origin; OAuth and Caffeine Atlas links unchanged."
      - name: Confirm supplement evidence is gated (anonymous, read-only)
        env:
          TRIAL_ORIGIN: https://labdam-free-approval.jleegenomics.workers.dev
        run: |
          set -eu
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$TRIAL_ORIGIN/labinsight/supplement-guidance.js")
          test "$code" = 401

      - name: Confirm new CarePath endpoints are gated (anonymous, read-only)
        env:
          TRIAL_ORIGIN: https://labdam-free-approval.jleegenomics.workers.dev
        run: |
          set -eu
          path_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$TRIAL_ORIGIN/labinsight/carepath.html")
          script_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$TRIAL_ORIGIN/labinsight/carepath.js")
          model_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$TRIAL_ORIGIN/labinsight/carepath-data.js")
          test "$path_code" = 303
          test "$script_code" = 401
          test "$model_code" = 401
          echo "CarePath anonymous resource access denied; verified without health data."

      - name: Audit all protected pages and existing public Caffeine Atlas URLs
        if: ${{ !cancelled() && steps.deploy_trial.outcome == 'success' }}
        env:
          TRIAL_ORIGIN: https://labdam-free-approval.jleegenomics.workers.dev
        run: node free-auth/scripts/probe-trial-worker.mjs --origin "$TRIAL_ORIGIN"
