name: LABDAM deployed login visual audit (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/trial-login-live-visual.yml'
      - 'tests/trial-live/login.spec.cjs'
      - 'playwright.trial-live.config.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned browser and accessibility dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify deployed trial login using read-only browser visits
        run: npx playwright test tests/trial-live/login.spec.cjs --config=playwright.trial-live.config.cjs
      - name: Upload deployed screenshots and accessibility observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trial-login-visual-review
          path: |
            test-results-trial-live/
            playwright-report-trial-live/
          retention-days: 14
          if-no-files-found: ignore
